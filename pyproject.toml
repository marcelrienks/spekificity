[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spekificity"
version = "0.1.0"
description = "Specification-driven framework for rapid AI agent development"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Spekificity Contributors"}]
keywords = ["specification", "agent", "development", "workflow", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "speckit>=0.9.6",           # Spec → plan → implement orchestration
    "pydantic>=2.0",            # Type contracts and validation
    "gitpython>=3.1.0",         # Git integration (branch, commit, merge)
    "click>=8.0",               # CLI framework
    "PyYAML>=6.0",              # YAML parsing (vault frontmatter)
    "markdown>=3.4",            # Markdown parsing
    "python-dateutil>=2.8",     # Date/time utilities
]

optional-dependencies = {
    dev = [
        "pytest>=7.0",
        "pytest-cov>=4.0",
        "black>=23.0",
        "isort>=5.0",
        "flake8>=6.0",
        "mypy>=1.0",
        "pytest-asyncio>=0.21",
    ]
}

[project.scripts]
spek = "spekificity.cli.main:main"

[project.urls]
Homepage = "https://github.com/marcelrienks/spekificity"
Documentation = "https://github.com/marcelrienks/spekificity/wiki"
Repository = "https://github.com/marcelrienks/spekificity.git"
Issues = "https://github.com/marcelrienks/spekificity/issues"

[tool.setuptools]
packages = ["spekificity"]

[tool.setuptools.package-data]
spekificity = [
    "templates/*.md",
    "templates/*.yaml",
]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | tests/fixtures
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["spekificity/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers -v"
markers = [
    "unit: Unit tests (fast)",
    "integration: Integration tests (slower)",
    "e2e: End-to-end tests (slowest)",
]
