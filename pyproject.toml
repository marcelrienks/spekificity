[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spekificity"
version = "0.1.0-alpha.1"
description = "Specification-driven framework for rapid AI agent development"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Marcel Rienks", email = "marcel@example.com"}
]
requires-python = ">=3.11"
keywords = ["ai", "agent", "specification", "code-analysis", "cli"]
homepage = "https://github.com/marcelrienks/spekificity"
repository = "https://github.com/marcelrienks/spekificity"

dependencies = [
    "click>=8.1.0",        # CLI framework (deterministic, well-tested)
    "pydantic>=2.0.0",     # Data validation + serialization
    "sqlalchemy>=2.0.0",   # ORM for CodeGraph storage
    "gitpython>=3.1.0",    # Git operations
    "pygments>=2.15.0",    # Syntax highlighting (code analysis)
    "loguru>=0.7.0",       # Structured logging
    "pyyaml>=6.0.0",       # YAML for config + memory files
    "tomli>=2.0.0",        # TOML parsing (fallback for Python <3.11)
    "jinja2>=3.1.0",       # Template rendering (lesson formatting)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",       # Testing framework
    "pytest-cov>=4.1.0",   # Coverage reporting
    "black>=23.7.0",       # Code formatting
    "ruff>=0.0.280",       # Linting
    "mypy>=1.4.0",         # Type checking
    "pytest-mock>=3.11.0", # Mocking for tests
]
speckit = [
    "specify-cli>=0.1.0",  # SpecKit CLI for spec/plan generation
]
codegraph = [
    "sqlalchemy>=2.0.0",   # Already in main deps, but explicit for optional
]
integrations = [
    "specify-cli>=0.1.0",  # SpecKit integration
]

[project.scripts]
spek = "spekificity.cli.main:cli"
spek-init = "spekificity.cli.init:execute"

[tool.hatch.build.targets.wheel]
packages = ["src/spekificity"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.isort]
known-first-party = ["spekificity"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/spekificity --cov-report=term-missing --cov-report=html"
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src/spekificity"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.uv]
# Configuration for uv tool install
# Usage: uv tool install spekificity --from git+https://github.com/marcelrienks/spekificity.git
